    // --- AUDIO SYNTHESIZER (V8 RUMBLE) ---
    class V8AudioEngine {
      constructor() {
        this.ctx = null;
        this.osc1 = null;
        this.osc2 = null;
        this.gainNode = null;
        this.filter = null;
        this.isPlaying = false;
      }
      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.osc1 = this.ctx.createOscillator();
        this.osc2 = this.ctx.createOscillator();
        this.gainNode = this.ctx.createGain();
        this.filter = this.ctx.createBiquadFilter();

        this.osc1.type = 'sawtooth';
        this.osc2.type = 'triangle';

        this.filter.type = 'lowpass';
        this.filter.frequency.setValueAtTime(220, this.ctx.currentTime);

        this.gainNode.gain.setValueAtTime(0.001, this.ctx.currentTime);

        this.osc1.connect(this.filter);
        this.osc2.connect(this.filter);
        this.filter.connect(this.gainNode);
        this.gainNode.connect(this.ctx.destination);

        this.osc1.start();
        this.osc2.start();
      }
      setRPM(rpm) {
        if (!this.ctx || !this.isPlaying) return;
        // SBC V8 has 4 ignition pulses per crank revolution
        const baseFreq = (rpm / 60) * 2.0; 
        const now = this.ctx.currentTime;
        this.osc1.frequency.setTargetAtTime(Math.max(25, baseFreq * 1.5), now, 0.05);
        this.osc2.frequency.setTargetAtTime(Math.max(15, baseFreq * 0.75), now, 0.05);
        this.filter.frequency.setTargetAtTime(Math.min(2200, 160 + rpm * 0.28), now, 0.05);
      }
      start(rpm) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        this.gainNode.gain.setTargetAtTime(0.12, this.ctx.currentTime, 0.1);
        this.setRPM(rpm);
      }
      stop() {
        if (!this.ctx || !this.isPlaying) return;

    // Universal Fail-Safe Orbit Controls (Gemini) — tries THREE.OrbitControls
    // first, falls back to a built-in touch/mouse orbit controller.
    function setupUniversalOrbitControls(camera, domElement, targetVec = new THREE.Vector3(0, 1.0, 0)) {
          if (typeof THREE.OrbitControls === 'function') {
            try {
              const ctrl = new THREE.OrbitControls(camera, domElement);
              ctrl.enableDamping = true;
              ctrl.dampingFactor = 0.05;
              ctrl.target.copy(targetVec);
              return ctrl;
            } catch (e1) {}
          }
          try {
            let isDragging = false;
            let prevX = 0, prevY = 0;
            let spherical = {
              radius: camera.position.distanceTo(targetVec) || 30,
              theta: Math.atan2(camera.position.x - targetVec.x, camera.position.z - targetVec.z) || 0.6,
              phi: Math.acos(Math.max(-1, Math.min(1, (camera.position.y - targetVec.y) / (camera.position.distanceTo(targetVec) || 30)))) || 1.1
            };

            const updateCamera = () => {
              camera.position.x = targetVec.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
              camera.position.y = targetVec.y + spherical.radius * Math.cos(spherical.phi);
              camera.position.z = targetVec.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
              camera.lookAt(targetVec);
            };

            const onMouseDown = (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; };
            const onMouseMove = (e) => {
              if (!isDragging) return;
              spherical.theta -= (e.clientX - prevX) * 0.008;
              spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - (e.clientY - prevY) * 0.008));
              prevX = e.clientX; prevY = e.clientY;
              updateCamera();
            };
            const onMouseUp = () => { isDragging = false; };
            const onWheel = (e) => {
              e.preventDefault();
              spherical.radius = Math.max(6, Math.min(60, spherical.radius + e.deltaY * 0.02));
              updateCamera();
            };

            domElement.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            domElement.addEventListener('wheel', onWheel, { passive: false });
            updateCamera();

            return {
              update: () => {},
              dispose: () => {
                domElement.removeEventListener('mousedown', onMouseDown);
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
                domElement.removeEventListener('wheel', onWheel);
              }
            };
          } catch (nativeErr) {
            return { update: () => {}, dispose: () => {} };
          }
        }

        // Poll until the container has size (10 s cap), watch it with a

        // the cap FORCE a size and BUILD with it instead of giving up.
        const POLL_MS = 150;
        const MAX_WAIT_MS = 10000;

        let pollTimer = null;
        let sizeObserver = null;
        let built = false;

        const measure = () => {
          const rect = container.getBoundingClientRect();

            width: rect.width || container.clientWidth,
            height: rect.height || container.clientHeight

          return true;

        const forceBuild = () => {

          // with it. Never give up with a 0x0 error while the container
          // exists in the DOM — a renderer built at the forced size will

          doBuild(
            width || container.clientWidth || window.innerWidth,
            height || container.clientHeight || Math.max(420, window.innerHeight - headerHeight)
          );
        };

        const poll = () => {
          if (disposed || built) return;
          if (tryBuild()) return;
          if (Date.now() - startedAt >= MAX_WAIT_MS) {

            return;
          }

        const buildThree = (width, height) => {

        }
        engineGroup.add(camGroup);
        parts.camshaft = camGroup;

        // 4. PISTONS (WITH RING GROOVES & 0.927" WRIST PINS) & 5.700" RODS
        const rotatingAssemblyGroup = new THREE.Group();

        const pistonNodes = [];
        // Scaled from the selected engine in the library (Ray's 350: 3.480" stroke, 5.700" rods)

          rodMesh.userData = { name: "Forged 4340 Rod (5.700\" Spec)", specs: "Length: 5.700\" Center-to-Center | ARP 3/8\" Cap Bolts" };
          pGroup.add(rodMesh);

          rotatingAssemblyGroup.add(pGroup);
          pistonNodes.push({
            group: pGroup,

        engineGroup.add(rotatingAssemblyGroup);
        parts.rotatingAssembly = rotatingAssemblyGroup;

        // 4. CYLINDER HEADS (64cc Combustion Chambers)

          specs: "Carb Flange: Square-bore 4150 | Runner Volume: 190cc | Height: 4.85\"",

        const intakeValleyMesh = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.0, 9.6), materials.intake);

        // Main body

        // 7. EXHAUST HEADERS (Tubular 4-into-1 Long-Tubes)

        [-1, 1].forEach((side) => {

            sideHeaderGroup.add(tubeMesh);
          }

          const collector = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.0, 2.5, 16), materials.headers);
          collector.rotation.x = Math.PI / 2;
          collector.position.set(side * 0.8, -3.2, 3.2);
          sideHeaderGroup.add(collector);

          headersGroup.add(sideHeaderGroup);
        });
        engineGroup.add(headersGroup);
        parts.headers = headersGroup;

        // 8. OIL PAN & ACCESSORIES
        const oilPanGroup = new THREE.Group();
        oilPanGroup.name = "Baffled 5-Quart Oil Pan";
        oilPanGroup.userData = {
          name: "Deep Sump Stamped Steel Pan",
          desc: "Internal windage tray with crank scraper and trap-door baffling to prevent high-RPM oil starvation.",
          specs: "Capacity: 5 Quarts + Filter | Sump Depth: 8.25\" | Drain Plug: 1/2-20",
          torque: "Oil Pan Bolts (1/4-20): 8 ft-lbs (100 in-lbs) | Corner Bolts (5/16-18): 12 ft-lbs"
        };
        const panMesh = new THREE.Mesh(new THREE.BoxGeometry(5.2, 2.2, 11.2), materials.oilPan);
        panMesh.position.set(0, -3.2, 0);
        oilPanGroup.add(panMesh);
        engineGroup.add(oilPanGroup);
        parts.oilPan = oilPanGroup;

        // Front Pulleys & Balancer
        const frontDressGroup = new THREE.Group();
        frontDressGroup.name = "Harmonic Balancer & Timing Pulleys";
        frontDressGroup.userData = {
          name: "8-Inch Harmonic Balancer & Serpentine Drive",
          desc: "Elastomer balanced 8.00\" harmonic damper to attenuate torsional crankshaft vibrations.",
          specs: "Diameter: 8.00\" | Timing Marks: 0-30° BTDC | Keyway: 3/16\"",
          torque: "Center Damper Bolt (5/8-18): 60-65 ft-lbs | Pulley Bolts (3/8-16): 20 ft-lbs"
        };
        const balancer = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.8, 32), materials.chrome);
        balancer.rotation.x = Math.PI / 2;
        balancer.position.set(0, -1.0, 6.6);
        frontDressGroup.add(balancer);

        const waterPumpPulley = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.6, 32), materials.chrome);
        waterPumpPulley.rotation.x = Math.PI / 2;
        waterPumpPulley.position.set(0, 1.6, 6.8);
        frontDressGroup.add(waterPumpPulley);

        engineGroup.add(frontDressGroup);
        parts.frontDress = frontDressGroup;

        scene.add(engineGroup);
        enginePartsRef.current = { parts, pistonNodes };

        // Raycasting for interactive part selection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const onCanvasClick = (event) => {
          const rect = renderer.domElement.getBoundingClientRect();
          const clientX = event.clientX || (event.touches && event.touches[0] && event.touches[0].clientX);
          const clientY = event.clientY || (event.touches && event.touches[0] && event.touches[0].clientY);
          if (!clientX || !clientY) return;
          mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(engineGroup.children, true);
          if (intersects.length > 0) {
            let hit = intersects[0].object;
            while (hit.parent && hit.parent !== engineGroup) {
              hit = hit.parent;
            }
            if (hit.userData && hit.userData.name) {
              setSelectedPart(hit.userData);
            }
          }
        };
        renderer.domElement.addEventListener('click', onCanvasClick);

        // --- ANIMATION LOOP ---
        let renderFailed = false;
        let lastTime = performance.now();
        const animate = (now) => {
          animFrameIdRef.current = requestAnimationFrame(animate);

          const dt = (now - lastTime) / 1000;
          lastTime = now;

          if (controlsRef.current) controlsRef.current.update();

          // RUN CYCLE ACTION: reads refs so the loop always sees the latest
          // RUN / RPM state (v4 read stale closure state — the loop never saw
          // a RUN toggle after the first build). Rotates crank + cam, reciprocates
          // pistons, pulses the valvetrain (Gemini cutaway).
          if (isRunningRef.current) {
            const currentRpm = rpmRef.current;
            const radPerSec = (currentRpm / 60) * 2 * Math.PI;
            crankAngleRef.current += radPerSec * dt;

            // Crankshaft rotation
            if (parts.crank) {
              parts.crank.rotation.z = crankAngleRef.current;
            }
            if (parts.camshaft) parts.camshaft.children[0].rotation.z = crankAngleRef.current / 2; // Cam turns at 1/2 crank speed
            if (parts.frontDress) {
              parts.frontDress.children[0].rotation.z = crankAngleRef.current;
              parts.frontDress.children[1].rotation.z = -crankAngleRef.current * 1.2;
            }

            // Reciprocating Pistons Kinematics (Slider-Crank Formula)
            pistonNodes.forEach((node) => {
              const theta = crankAngleRef.current + node.angleOffset;
              // True kinematic slider-crank displacement along bore
              const disp = (crankRadius * Math.cos(theta)) + 
                           Math.sqrt(Math.max(0, Math.pow(rodLength, 2) - Math.pow(crankRadius * Math.sin(theta), 2))) - rodLength;
              node.group.position.y = node.baseY + disp * 0.45;
            });

            // Valvetrain Cam Lift Pulse Action
            valvetrainNodes.forEach((vNode) => {
              const camPulse = Math.max(0, Math.sin(crankAngleRef.current * 0.5 + vNode.offset));
              vNode.lifter.position.y = vNode.baseY + camPulse * 0.25;
              vNode.valve.position.y = 3.0 - camPulse * 0.25; // Valve plunges down into chamber!
              vNode.rocker.rotation.z = camPulse * 0.15;
            });
          }

          try {
            renderer.render(scene, camera);
          } catch (err) {
            if (!renderFailed) {
              renderFailed = true;
              window.__sbcThreeError = err;
              setThreeError('3D render failed: ' + err.message);
            }
            if (animFrameIdRef.current) cancelAnimationFrame(animFrameIdRef.current);
            return;
          }
        };
        animFrameIdRef.current = requestAnimationFrame(animate);

        // Window resize handler
        const handleResize = () => {
          if (!container || !rendererRef.current || !cameraRef.current) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          rendererRef.current.setSize(w, h);
          if (cameraRef.current.isPerspectiveCamera) {
            cameraRef.current.aspect = w / h;
            cameraRef.current.updateProjectionMatrix();
          }
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          if (renderer.domElement) renderer.domElement.removeEventListener('click', onCanvasClick);
          if (animFrameIdRef.current) cancelAnimationFrame(animFrameIdRef.current);
          if (renderer.domElement && renderer.domElement.parentNode) {
            renderer.domElement.parentNode.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
        };

        // ResizeObserver: build the moment the container gains size, and
        // keep polling as a backstop (observer may not fire everywhere).
        if (typeof ResizeObserver === 'function') {
          sizeObserver = new ResizeObserver(() => {
            if (!disposed && !built) tryBuild();
          });
          sizeObserver.observe(container);
        }
        poll();
        return () => {
          disposed = true;
          if (pollTimer) clearTimeout(pollTimer);
          if (sizeObserver) sizeObserver.disconnect();
          if (innerCleanup) innerCleanup();
        };
      }, [activeTab, viewMode, cutawayMode, cutawayDepth, currentEngineId, selectedIntakeId, headerHeight]);

      useEffect(() => {
        if (activeTab !== 'trans') return;
        const container = transCanvasContainerRef.current;
        if (!container) return;

        let disposed = false;
        let innerCleanup = null;
        const POLL_MS = 150;
        const MAX_WAIT_MS = 10000;
        const startedAt = Date.now();
        let pollTimer = null;
        let sizeObserver = null;
        let built = false;

        const measure = () => {
          const rect = container.getBoundingClientRect();
          return {
            width: rect.width || container.clientWidth,
            height: rect.height || container.clientHeight
          };
        };

        const doBuild = (width, height) => {
          built = true;
          try {
            innerCleanup = buildTrans(width, height);
          } catch (err) {
            window.__sbcThreeError = err;
            setThreeError('Transmission 3D failed to start: ' + err.message);
          }
        };

        const tryBuild = () => {
          if (disposed || built) return false;
          const { width, height } = measure();
          if (width === 0 || height === 0) return false;
          doBuild(width, height);
          return true;
        };

        const forceBuild = () => {
          if (disposed || built) return;
          container.style.height = Math.max(420, window.innerHeight - headerHeight) + 'px';
          container.style.width = '100%';
          const { width, height } = measure();
          doBuild(
            width || container.clientWidth || window.innerWidth,
            height || container.clientHeight || Math.max(420, window.innerHeight - headerHeight)
          );
        };

        const poll = () => {
          if (disposed || built) return;
          if (tryBuild()) return;
          if (Date.now() - startedAt >= MAX_WAIT_MS) {
            forceBuild();
            return;
          }
          pollTimer = setTimeout(poll, POLL_MS);
        };

        const buildTrans = (width, height) => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x14181c);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
        light1.position.set(15, 20, 15);
        scene.add(light1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const grid = new THREE.GridHelper(24, 24, 0xe5a823, 0x334155);
        grid.position.y = -3.5;
        scene.add(grid);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(16, 10, 16);
        camera.lookAt(0, 0, 0);

        const controls = setupUniversalOrbitControls(camera, renderer.domElement, new THREE.Vector3(0, 0, 0));

        const transGroup = new THREE.Group();
        const transParts = {};

        const alumMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.3, metalness: 0.7 });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xe5a823, roughness: 0.3, metalness: 0.8 }); // Torque converter
        const steelMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.2, metalness: 0.9 });

        // 1. Bellhousing (Front)
        const bellhousing = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 4.4, 3.2, 24, 1, true), alumMat);
        bellhousing.rotation.z = Math.PI / 2;
        bellhousing.position.x = -4.5;
        bellhousing.userData = { name: "Chevy V8 Bellhousing", specs: "Standard 6-bolt SBC/BBC pattern" };
        transGroup.add(bellhousing);
        transParts.bellhousing = bellhousing;

        // 2. Torque Converter (or Clutch/Flywheel)
        const converter = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 1.6, 32), currentTrans.type === 'Automatic' ? goldMat : steelMat);
        converter.rotation.z = Math.PI / 2;
        converter.position.x = -4.5;
        converter.userData = {
          name: currentTrans.type === 'Automatic' ? `${stallSpeed} RPM Torque Converter` : "11\" Billet Clutch & Flywheel",
          specs: currentTrans.type === 'Automatic' ? `Stall: ${stallSpeed} RPM | Lockup Clutch` : currentTrans.clutchPack
        };
        transGroup.add(converter);
        transParts.converter = converter;

        // 3. Main Transmission Case
        const mainCase = new THREE.Mesh(new THREE.BoxGeometry(5.5, 3.8, 3.8), alumMat);
        mainCase.position.x = 0;
        mainCase.userData = { name: `${currentTrans.name} Case`, specs: `Type: ${currentTrans.type} | Ratios: ${currentTrans.ratios.join(', ')}` };
        transGroup.add(mainCase);
        transParts.mainCase = mainCase;

        // 4. Internal Gear Assembly / Shaft
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 12, 16), steelMat);
        shaft.rotation.z = Math.PI / 2;
        shaft.position.x = 1.0;
        transGroup.add(shaft);
        transParts.shaft = shaft;

        // 5. Tailshaft Housing (Rear)
        const tailshaft = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 2.6, 4.2, 20), alumMat);
        tailshaft.rotation.z = -Math.PI / 2;
        tailshaft.position.x = 4.8;
        tailshaft.userData = { name: "Extension Tailhousing & Slip Yoke", specs: "27-spline output shaft" };
        transGroup.add(tailshaft);
        transParts.tailshaft = tailshaft;

        scene.add(transGroup);
        renderer.render(scene, camera);

        let transAnimId;
        const animateTrans = () => {
          transAnimId = requestAnimationFrame(animateTrans);
          if (controls.update) controls.update();

          const f = transExplodedRef.current;
          if (transParts.bellhousing) transParts.bellhousing.position.x = -4.5 - f * 5.0;
          if (transParts.converter) transParts.converter.position.x = -4.5 - f * 2.5;
          if (transParts.tailshaft) transParts.tailshaft.position.x = 4.8 + f * 5.0;

          if (transRunningRef.current && transParts.shaft) {
            transParts.shaft.rotation.y += 0.08;
            transParts.converter.rotation.y += 0.08;
          }
          renderer.render(scene, camera);
        };
        animateTrans();
        return () => {

      useEffect(() => {

          doBuild(

        const buildDynoRoom = (width, height) => {

      const liveEngineTelemetry = useMemo(() => {

        const tqDelta = (rpm - activeEngine.dyno.tqPeakRpm) / 1800;
        let tq = activeEngine.dyno.baseTq * Math.exp(-Math.pow(tqDelta, 2));

        // Live Timing Modifier (36° is optimal on 64cc chamber SBC)
        const timingDelta = ignitionTiming - 36;
        let timingFactor = 1.0;
        let knockAlert = false;
        if (timingDelta > 2) {
          knockAlert = true; // Detonation threshold exceeded!
          timingFactor = 0.92;
        } else if (timingDelta < 0) {
          timingFactor = Math.max(0.85, 1.0 + timingDelta * 0.015);
        }

        // Live AFR Modifier (12.8:1 - 13.0:1 optimal for N/A power)
        const afrDelta = targetAFR - 12.9;
        const afrFactor = Math.max(0.88, 1.0 - Math.pow(afrDelta, 2) * 0.04);

        // Nitrous Oxide Boost (+100 HP, +120 TQ)
        const nosBoostHp = nitrousActive ? 100 : 0;
        const nosBoostTq = nitrousActive ? 120 : 0;

        tq = Math.round((tq * timingFactor * afrFactor) + nosBoostTq);

        const oilPsi = Math.round(40 + (rpm / 6500) * 25);
