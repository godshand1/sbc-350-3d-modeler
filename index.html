<body class="text-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- BASELINE ENGINEERING CONSTANTS (RAY'S SPECS) ---
    const ENGINE_SPECS = {
      name: "Gen-1 Chevrolet Small-Block 350 (V8)",
      displacementCi: 350.4,
      displacementL: 5.74,
      bore: 4.000,           // in
      stroke: 3.480,         // in
      rodLength: 5.700,      // in (Ray's baseline)
      deckHeight: 9.025,     // in (Ray's baseline)
      chamberCc: 64.0,       // cc (Ray's baseline)
      gasketThickness: 0.039,// in (Ray's baseline)
      deckClearance: 0.015,  // in (Ray's baseline)
      pistonDishCc: 5.0,     // 4-eyebrow flat top standard
      quenchDistance: 0.054, // 0.039 + 0.015 = 0.054"
      staticCR: 9.90,        // Computed Static Compression Ratio
      firingOrder: "1-8-4-3-6-5-7-2"
    };

    // --- AUDIO SYNTHESIZER (V8 RUMBLE) ---
    class V8AudioEngine {
      constructor() {
        this.ctx = null;
        this.osc1 = null;
        this.osc2 = null;
        this.gainNode = null;
        this.filter = null;
        this.isPlaying = false;
      }
      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.osc1 = this.ctx.createOscillator();
        this.osc2 = this.ctx.createOscillator();
        this.gainNode = this.ctx.createGain();
        this.filter = this.ctx.createBiquadFilter();

        this.osc1.type = 'sawtooth';
        this.osc2.type = 'triangle';

        this.filter.type = 'lowpass';
        this.filter.frequency.setValueAtTime(220, this.ctx.currentTime);

        this.gainNode.gain.setValueAtTime(0.001, this.ctx.currentTime);

        this.osc1.connect(this.filter);
        this.osc2.connect(this.filter);
        this.filter.connect(this.gainNode);
        this.gainNode.connect(this.ctx.destination);

        this.osc1.start();
        this.osc2.start();
      }
      setRPM(rpm) {
        if (!this.ctx || !this.isPlaying) return;
        // SBC V8 has 4 ignition pulses per crank revolution
        const baseFreq = (rpm / 60) * 2.0; 
        const now = this.ctx.currentTime;
        this.osc1.frequency.setTargetAtTime(Math.max(25, baseFreq * 1.5), now, 0.05);
        this.osc2.frequency.setTargetAtTime(Math.max(15, baseFreq * 0.75), now, 0.05);
        this.filter.frequency.setTargetAtTime(Math.min(2200, 160 + rpm * 0.28), now, 0.05);
      }
      start(rpm) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        this.gainNode.gain.setTargetAtTime(0.12, this.ctx.currentTime, 0.1);
        this.setRPM(rpm);
      }
      stop() {
        if (!this.ctx || !this.isPlaying) return;
        this.gainNode.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.1);
        this.isPlaying = false;
      }
    }
    const audioEngine = new V8AudioEngine();

    // --- MAIN REACT APPLICATION COMPONENT ---
    function SBC350App() {
      const [activeTab, setActiveTab] = useState('block3d');
      const [viewMode, setViewMode] = useState('realistic'); // 'realistic' | 'isometric' | 'technical'
      const [explodedAmount, setExplodedAmount] = useState(0); // 0 to 1
      const [rpm, setRpm] = useState(850);
      const [isRunning, setIsRunning] = useState(false);
      const [isAudioOn, setIsAudioOn] = useState(false);
      const [selectedPart, setSelectedPart] = useState(null);
      const [threeError, setThreeError] = useState(null); // Fail-safe: surfaces 3D init/render errors on screen

      // Dyno & Configuration State
      const [camProfile, setCamProfile] = useState('street'); 
      const [carbCfm, setCarbCfm] = useState(650);
      const [intakeType, setIntakeType] = useState('dualplane');
      const [selectedTrans, setSelectedTrans] = useState('th350');
      const [rearGear, setRearGear] = useState(3.73);
      const [tireDiameter, setTireDiameter] = useState(26.0);
      const [selectedVehicle, setSelectedVehicle] = useState('chevelle1970');

      const canvasContainerRef = useRef(null);
      const sceneRef = useRef(null);
      const rendererRef = useRef(null);
      const cameraRef = useRef(null);
      const controlsRef = useRef(null);
      const enginePartsRef = useRef({});
      const animFrameIdRef = useRef(null);
      const crankAngleRef = useRef(0);

      // Handle Engine Audio
      useEffect(() => {
        if (isRunning && isAudioOn) {
          audioEngine.start(rpm);
        } else {
          audioEngine.stop();
        }
      }, [isRunning, isAudioOn]);

      useEffect(() => {
        if (isRunning && isAudioOn) {
          audioEngine.setRPM(rpm);
        }
      }, [rpm]);

      // --- THREE.JS INITIALIZATION & SCENE SETUP ---
      // Fail-safe wrapper (Ray's go-ahead, Nov 22-23): the 3D init used to
      // fail silently and leave a blank viewport. Polls until the viewport
      // has size (10 s cap) with a ResizeObserver trigger, forces a size
      // and builds instead of giving up, guards renderer/controls
      // creation, and surfaces any error on screen.
      useEffect(() => {
        if (activeTab !== 'block3d') return;
        const container = canvasContainerRef.current;
        if (!container) return;

        let disposed = false;
        let innerCleanup = null;

        // Reliability (Ray's go-ahead, Nov 23): the old 10 x 150 ms retry
        // gave up after 1.5 s, before layout settles on a cold first load
        // (CDN scripts + in-browser Babel transform delay first paint).
        // Poll until the container has size (10 s cap), watch it with a
        // ResizeObserver so init fires the moment size appears, and after
        // the cap FORCE a size and BUILD with it instead of giving up.
        const POLL_MS = 150;
        const MAX_WAIT_MS = 10000;
        const startedAt = Date.now();
        let pollTimer = null;
        let sizeObserver = null;
        let built = false;

        const measure = () => {
          const rect = container.getBoundingClientRect();
          return {
            width: rect.width || container.clientWidth,
            height: rect.height || container.clientHeight
          };
        };

        const doBuild = (width, height) => {
          built = true;
          try {
            setThreeError(null);
            innerCleanup = buildThree(width, height);
          } catch (err) {
            window.__sbcThreeError = err;
            setThreeError('3D failed to start: ' + err.message);
          }
        };

        const tryBuild = () => {
          if (disposed || built) return false;
          const { width, height } = measure();
          if (width === 0 || height === 0) return false;
          doBuild(width, height);
          return true;
        };

        const forceBuild = () => {
          if (disposed || built) return;
          // Last resort: force an explicit size from the window and BUILD
          // with it. Never give up with a 0x0 error while the container
          // exists in the DOM — a renderer built at the forced size will
          // draw as soon as layout settles.
          container.style.height = Math.max(420, window.innerHeight - 62) + 'px';
          container.style.width = '100%';
          const { width, height } = measure();
          doBuild(
            width || container.clientWidth || window.innerWidth,
            height || container.clientHeight || Math.max(420, window.innerHeight - 62)
          );
        };

        const poll = () => {
          if (disposed || built) return;
          if (tryBuild()) return;
          if (Date.now() - startedAt >= MAX_WAIT_MS) {
            forceBuild();
            return;
          }
          pollTimer = setTimeout(poll, POLL_MS);
        };

        const buildThree = (width, height) => {

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(viewMode === 'technical' ? 0x07111a : 0x14181c);
        sceneRef.current = scene;

        // Camera
        let camera;
        if (viewMode === 'isometric') {
          const aspect = width / height;
          const d = 14;
          camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
          camera.position.set(20, 20, 20);
        } else {
          camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
          camera.position.set(16, 12, 22);
        }
        camera.lookAt(0, 0, 0);
        cameraRef.current = camera;

        // Renderer (fail-safe: retry once without antialias/alpha if creation throws)
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        } catch (err) {
          try {
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
          } catch (err2) {
            window.__sbcThreeError = err2;
            setThreeError('3D failed to start: ' + err2.message);
            return;
          }
        }
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = viewMode === 'realistic';
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.innerHTML = '';
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        // Controls (guard: the scene must still render if OrbitControls never loaded)
        const controls = (typeof THREE.OrbitControls === 'function')
          ? new THREE.OrbitControls(camera, renderer.domElement)
          : null;
        if (controls) {
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
          controls.maxDistance = 60;
          controls.minDistance = 3;
          controlsRef.current = controls;
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, viewMode === 'technical' ? 0.9 : 0.6);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, viewMode === 'technical' ? 0.4 : 1.2);
        dirLight1.position.set(15, 25, 15);
        dirLight1.castShadow = viewMode === 'realistic';
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x7090ff, 0.4);
        dirLight2.position.set(-15, -10, -15);
        scene.add(dirLight2);

        // Ground Blueprint Grid
        const gridHelper = new THREE.GridHelper(30, 30, 0x00f0ff, 0x223344);
        gridHelper.position.y = -6;
        scene.add(gridHelper);

        // --- MATERIALS MATRIX ---
        const isTech = viewMode === 'technical';
        const materials = {
          block: new THREE.MeshStandardMaterial({
            color: isTech ? 0x00f0ff : 0xd83b01, // Chevy Orange
            roughness: isTech ? 0.8 : 0.5,
            metalness: isTech ? 0.1 : 0.2,
            wireframe: isTech
          }),
          aluminumHead: new THREE.MeshStandardMaterial({
            color: isTech ? 0x66ccff : 0xc0c8d0,
            roughness: 0.35,
            metalness: 0.65,
            wireframe: isTech
          }),
          crankshaft: new THREE.MeshStandardMaterial({
            color: isTech ? 0x00e5ff : 0x8a939e,
            roughness: 0.25,
            metalness: 0.85,
            wireframe: isTech
          }),
          pistons: new THREE.MeshStandardMaterial({
            color: isTech ? 0x38bdf8 : 0xdde2e6,
            roughness: 0.2,
            metalness: 0.8,
            wireframe: isTech
          }),
          intake: new THREE.MeshStandardMaterial({
            color: isTech ? 0x00f0ff : 0xb8c0c8,
            roughness: 0.4,
            metalness: 0.5,
            wireframe: isTech
          }),
          carb: new THREE.MeshStandardMaterial({
            color: isTech ? 0x93c5fd : 0xd4af37, // Zinc dichromate / Gold Holley
            roughness: 0.3,
            metalness: 0.6,
            wireframe: isTech
          }),
          headers: new THREE.MeshStandardMaterial({
            color: isTech ? 0x38bdf8 : 0x2e343b,
            roughness: 0.6,
            metalness: 0.5,
            wireframe: isTech
          }),
          oilPan: new THREE.MeshStandardMaterial({
            color: isTech ? 0x00f0ff : 0x111111,
            roughness: 0.4,
            metalness: 0.7,
            wireframe: isTech
          }),
          chrome: new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.1,
            metalness: 0.95
          })
        };

        // --- BUILD 3D SBC 350 ENGINE ASSEMBLY ---
        const engineGroup = new THREE.Group();
        const parts = {};

        // 1. ENGINE BLOCK (Cast Iron, 90° V-bank)
        const blockGroup = new THREE.Group();
        blockGroup.name = "Engine Block (350ci - 4.000\" Bore)";
        blockGroup.userData = {
          name: "Gen-1 SBC 350 Cylinder Block",
          desc: "90-degree V8 cast-iron block with 4.000-inch bore cylinders, 9.025-inch deck height, 2-piece / 1-piece rear main seal tunnel.",
          specs: "Bore: 4.000\" | Deck: 9.025\" | Main Journal Dia: 2.45\" | Cam Tunnel: 2.000\"",
          torque: "Main Caps: 70 ft-lbs (inner), 65 ft-lbs (outer 4-bolt)"
        };

        // Lower crankcase core
        const crankcaseGeo = new THREE.BoxGeometry(6.4, 3.8, 12);
        const crankcaseMesh = new THREE.Mesh(crankcaseGeo, materials.block);
        crankcaseMesh.position.y = -0.5;
        blockGroup.add(crankcaseMesh);

        // Bank Left (-45 deg) & Bank Right (+45 deg)
        [-1, 1].forEach((side) => {
          const bankGroup = new THREE.Group();
          bankGroup.position.set(side * 2.1, 1.2, side === 1 ? -0.2 : 0.2); // Cyl staggered forward
          bankGroup.rotation.z = side * (-Math.PI / 4);

          const deckGeo = new THREE.BoxGeometry(4.4, 2.8, 11.8);
          const deckMesh = new THREE.Mesh(deckGeo, materials.block);
          bankGroup.add(deckMesh);

          // 4 Cylinder Bores per bank
          for (let i = 0; i < 4; i++) {
            const boreGeo = new THREE.CylinderGeometry(1.2, 1.2, 3.0, 24);
            const boreMat = new THREE.MeshBasicMaterial({ color: 0x050505, wireframe: isTech });
            const boreMesh = new THREE.Mesh(boreGeo, boreMat);
            boreMesh.position.set(0, 0, -4.5 + i * 3.0);
            bankGroup.add(boreMesh);
          }
          blockGroup.add(bankGroup);
        });
        engineGroup.add(blockGroup);
        parts.block = blockGroup;

        // 2. CRANKSHAFT (Forged Steel 3.480" Stroke)
        const crankGroup = new THREE.Group();
        crankGroup.name = "Crankshaft (3.480\" Stroke)";
        crankGroup.userData = {
          name: "Forged Steel Crankshaft",
          desc: "Large journal 3.480\" stroke crank with dual counterweights, 2.45\" mains, and 2.10\" rod journals.",
          specs: "Stroke: 3.480\" | Main Journal: 2.449\" | Rod Journal: 2.100\" | Radius: 1.740\"",
          torque: "Flywheel: 60 ft-lbs | Damper: 60 ft-lbs"
        };
        const mainSnout = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 13.5, 24), materials.crankshaft);
        mainSnout.rotation.x = Math.PI / 2;
        mainSnout.position.y = -1.0;
        crankGroup.add(mainSnout);

        // Counterweights
        for (let j = 0; j < 5; j++) {
          const cwGeo = new THREE.CylinderGeometry(1.8, 1.8, 0.5, 16, 1, false, 0, Math.PI);
          const cwMesh = new THREE.Mesh(cwGeo, materials.crankshaft);
          cwMesh.rotation.z = (j % 2 === 0 ? 0 : Math.PI);
          cwMesh.rotation.x = Math.PI / 2;
          cwMesh.position.set(0, -1.0, -5.2 + j * 2.6);
          crankGroup.add(cwMesh);
        }
        engineGroup.add(crankGroup);
        parts.crank = crankGroup;

        // 3. PISTONS & 5.700" CONNECTING RODS
        const rotatingAssemblyGroup = new THREE.Group();
        rotatingAssemblyGroup.name = "Pistons & 5.700\" Rods";
        rotatingAssemblyGroup.userData = {
          name: "Pistons & Rods (Ray's Spec: 5.700\" Rod Length)",
          desc: "Forged H-beam 5.700-inch rods paired to 4.000-inch forged flat-top pistons with 4-valve reliefs.",
          specs: "Rod: 5.700\" C-to-C | Piston: 4.000\" | Deck Clearance: 0.015\" | Pin: 0.927\"",
          torque: "Rod Cap Bolts (3/8\" ARP): 45 ft-lbs with moly lube"
        };

        const pistonNodes = [];
        const crankRadius = 3.480 * 0.35; // Model scaled
        const rodLength = 5.700 * 0.35;   // Model scaled

        for (let p = 0; p < 8; p++) {
          const isRight = p % 2 === 0;
          const bankAngle = isRight ? Math.PI / 4 : -Math.PI / 4;
          const bankSign = isRight ? 1 : -1;
          const cylIndex = Math.floor(p / 2);

          const pGroup = new THREE.Group();
          pGroup.position.set(bankSign * 1.8, 1.2, -4.5 + cylIndex * 3.0 + (isRight ? -0.2 : 0.2));
          pGroup.rotation.z = -bankAngle;

          // Piston Crown & Skirt
          const pistonCrown = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 1.1, 24), materials.pistons);
          pistonCrown.position.y = 1.6;
          pGroup.add(pistonCrown);

          // Connecting Rod
          const rodMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, rodLength, 12), materials.crankshaft);
          rodMesh.position.y = 0.3;
          pGroup.add(rodMesh);

          rotatingAssemblyGroup.add(pGroup);
          pistonNodes.push({
            group: pGroup,
            angleOffset: (p * Math.PI) / 4,
            baseY: 1.2,
            bankSign
          });
        }
        engineGroup.add(rotatingAssemblyGroup);
        parts.rotatingAssembly = rotatingAssemblyGroup;

        // 4. CYLINDER HEADS (64cc Combustion Chambers)
        const headsGroup = new THREE.Group();
        headsGroup.name = "Cylinder Heads (64cc Chambers)";
        headsGroup.userData = {
          name: "64cc Combustion Chamber Heads",
          desc: "High-velocity intake ports, 2.02\" intake / 1.60\" exhaust valves, straight spark plug orientation.",
          specs: "Chamber: 64cc | Intake Port: 195cc | Valves: 2.02\" / 1.60\" | Gasket: 0.039\" compressed",
          torque: "Head Bolts (7/16-14): 65 ft-lbs in 3 steps (25, 45, 65 ft-lbs)"
        };
        [-1, 1].forEach((side) => {
          const headMeshGroup = new THREE.Group();
          headMeshGroup.position.set(side * 3.8, 3.2, 0);
          headMeshGroup.rotation.z = side * (-Math.PI / 4);

          const headGeo = new THREE.BoxGeometry(3.6, 2.6, 12.2);
          const headMesh = new THREE.Mesh(headGeo, materials.aluminumHead);
          headMeshGroup.add(headMesh);

          // Valve Cover
          const vcGeo = new THREE.BoxGeometry(2.8, 1.6, 11.6);
          const vcMesh = new THREE.Mesh(vcGeo, materials.chrome);
          vcMesh.position.y = 2.0;
          headMeshGroup.add(vcMesh);

          headsGroup.add(headMeshGroup);
        });
        engineGroup.add(headsGroup);
        parts.heads = headsGroup;

        // 5. INTAKE MANIFOLD (Dual-Plane High-Rise)
        const intakeGroup = new THREE.Group();
        intakeGroup.name = "Dual-Plane Intake Manifold";
        intakeGroup.userData = {
          name: "Aluminum Dual-Plane High-Rise Intake",
          desc: "Dual-plane 180° firing intake manifold designed for broad street/strip torque from 1,500 to 6,200 RPM.",
          specs: "Carb Flange: Square-bore 4150 | Runner Volume: 190cc | Height: 4.85\"",
          torque: "Intake Manifold Bolts (3/8-16): 25-30 ft-lbs (tighten center outward)"
        };
        const intakeValleyMesh = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.0, 9.6), materials.intake);
        intakeValleyMesh.position.set(0, 3.4, 0);
        intakeGroup.add(intakeValleyMesh);

        const plenumRiser = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.3, 1.4, 16), materials.intake);
        plenumRiser.position.set(0, 4.6, 0);
        intakeGroup.add(plenumRiser);
        engineGroup.add(intakeGroup);
        parts.intake = intakeGroup;

        // 6. CARBURETOR & CHROME AIR CLEANER
        const carbGroup = new THREE.Group();
        carbGroup.name = "Carburetor & Air Cleaner";
        carbGroup.userData = {
          name: "4-Barrel Carburetor (650 CFM)",
          desc: "Mechanical secondaries, dual metering blocks, dual fuel bowls, down-leg boosters.",
          specs: "CFM: 650 CFM | Primary Jets: #68 | Secondary Jets: #76 | Power Valve: 6.5\"",
          torque: "Carb Mounting Studs (5/16-24): 60-80 in-lbs (do not over-tighten!)"
        };
        // Main body
        const carbBody = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.5, 2.8), materials.carb);
        carbBody.position.set(0, 5.8, 0);
        carbGroup.add(carbBody);

        // Dual float bowls
        [-1.6, 1.6].forEach((zOff) => {
          const bowl = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.1, 0.9), materials.carb);
          bowl.position.set(0, 5.7, zOff);
          carbGroup.add(bowl);
        });

        // 14" Round Chrome Air Cleaner
        const airFilter = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 1.4, 32), materials.chrome);
        airFilter.position.set(0, 7.0, 0);
        carbGroup.add(airFilter);

        const wingNut = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.6, 12), materials.carb);
        wingNut.position.set(0, 7.8, 0);
        carbGroup.add(wingNut);

        engineGroup.add(carbGroup);
        parts.carb = carbGroup;

        // 7. EXHAUST HEADERS (Tubular 4-into-1 Long-Tubes)
        const headersGroup = new THREE.Group();
        headersGroup.name = "Tubular Exhaust Headers";
        headersGroup.userData = {
          name: "1-5/8\" Long-Tube Headers",
          desc: "Mandrel bent equal-length primary tubes merging into 3-inch collectors for scavenging efficiency.",
          specs: "Primary Tube OD: 1.625\" | Collector Dia: 3.00\" | Flange: 3/8\" laser cut",
          torque: "Header Bolts (3/8-16): 20 ft-lbs (check after heat cycles)"
        };
        [-1, 1].forEach((side) => {
          const sideHeaderGroup = new THREE.Group();
          sideHeaderGroup.position.set(side * 4.6, 1.0, 0);

          // 4 Swept tubes
          for (let k = 0; k < 4; k++) {
            const tubeCurve = new THREE.CubicBezierCurve3(
              new THREE.Vector3(0, 1.5, -4.5 + k * 3.0),
              new THREE.Vector3(side * 1.5, 0.8, -4.0 + k * 2.8),

        // Raycasting for interactive part selection

          mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(engineGroup.children, true);
          if (intersects.length > 0) {
            let hit = intersects[0].object;

        // --- ANIMATION LOOP ---
        let renderFailed = false;
        let lastTime = performance.now();
        const animate = (now) => {
          animFrameIdRef.current = requestAnimationFrame(animate);

          const dt = (now - lastTime) / 1000;
          lastTime = now;

          if (controlsRef.current) controlsRef.current.update();

          // Running Engine Dynamics
          if (isRunning) {
            const radPerSec = (rpm / 60) * 2 * Math.PI;
            crankAngleRef.current += radPerSec * dt;

            // Crankshaft rotation
            if (parts.crank) {

            }
            if (parts.frontDress) {
              parts.frontDress.children[0].rotation.z = crankAngleRef.current;
              parts.frontDress.children[1].rotation.z = -crankAngleRef.current * 1.2;
            }

            // Reciprocating Pistons Kinematics (Slider-Crank Formula)
            pistonNodes.forEach((node) => {
              const theta = crankAngleRef.current + node.angleOffset;
              // True kinematic slider-crank displacement along bore
              const disp = (crankRadius * Math.cos(theta)) + 
                           Math.sqrt(Math.max(0, Math.pow(rodLength, 2) - Math.pow(crankRadius * Math.sin(theta), 2))) - rodLength;
              node.group.position.y = node.baseY + disp * 0.45;
            });
          }

          try {
            renderer.render(scene, camera);
          } catch (err) {
            if (!renderFailed) {
              renderFailed = true;
              window.__sbcThreeError = err;
              setThreeError('3D render failed: ' + err.message);
            }
            if (animFrameIdRef.current) cancelAnimationFrame(animFrameIdRef.current);
            return;
          }
        };
        animFrameIdRef.current = requestAnimationFrame(animate);

        // Window resize handler
        const handleResize = () => {
          if (!container || !rendererRef.current || !cameraRef.current) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          rendererRef.current.setSize(w, h);
          if (cameraRef.current.isPerspectiveCamera) {
            cameraRef.current.aspect = w / h;
            cameraRef.current.updateProjectionMatrix();
          }
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          if (renderer.domElement) renderer.domElement.removeEventListener('click', onCanvasClick);
          if (animFrameIdRef.current) cancelAnimationFrame(animFrameIdRef.current);
          if (renderer.domElement && renderer.domElement.parentNode) {
            renderer.domElement.parentNode.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
        };

        // ResizeObserver: build the moment the container gains size, and
        // keep polling as a backstop (observer may not fire everywhere).
        if (typeof ResizeObserver === 'function') {
          sizeObserver = new ResizeObserver(() => {
            if (!disposed && !built) tryBuild();
          });
          sizeObserver.observe(container);

        poll();
        return () => {
          disposed = true;
          if (pollTimer) clearTimeout(pollTimer);
          if (sizeObserver) sizeObserver.disconnect();
          if (innerCleanup) innerCleanup();

          rv: { hpPeakRpm: 4800, tqPeakRpm: 3200, baseHp: 295, baseTq: 380, ve: 0.82 },
          street: { hpPeakRpm: 5600, tqPeakRpm: 3800, baseHp: 385, baseTq: 415, ve: 0.90 },
          radical: { hpPeakRpm: 6400, tqPeakRpm: 4600, baseHp: 445, baseTq: 425, ve: 0.98 }
        }[camProfile];

        // Carb & Intake scaling factor
        const carbFactor = carbCfm >= 750 ? 1.05 : carbCfm === 650 ? 1.0 : 0.94;
        const intakeFactor = intakeType === 'singleplane' ? 1.04 : intakeType === 'tunnelram' ? 1.08 : 0.98;

        const peakHp = Math.round(camData.baseHp * carbFactor * intakeFactor);
        const peakTq = Math.round(camData.baseTq * (carbCfm >= 650 ? 1.02 : 0.98));

        const curve = [];
        for (let r = 1500; r <= 6500; r += 250) {
          // Torque mathematical curve based on Gaussian peak
          const tqDelta = (r - camData.tqPeakRpm) / 1800;
          const tq = Math.round(peakTq * Math.exp(-Math.pow(tqDelta, 2)));
          // Pure physics definition: HP = (Torque * RPM) / 5252
          const hp = Math.round((tq * r) / 5252);
          // Airflow CFM demand = (CID * RPM / 3456) * VE
          const cfmDemand = Math.round(((ENGINE_SPECS.displacementCi * r) / 3456) * camData.ve);
          // Fuel consumption (lbs/hr) = (HP * BSFC), BSFC ~ 0.50 lb/hp-hr
          const fuelLbHr = +(hp * 0.49).toFixed(1);

          curve.push({ rpm: r, hp, tq, cfmDemand, fuelLbHr });
        }
        return { curve, peakHp, peakTq, camData };
