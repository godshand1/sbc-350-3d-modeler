    class V8ExhaustAudioEngine {
      constructor() {
        this.ctx = null;
        this.osc1 = null;
        this.osc2 = null;
        this.gain = null;
        this.filter = null;
        this.isPlaying = false;
      }
      start(rpm) {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.isPlaying) return;

        this.gain = this.ctx.createGain();
        this.gain.gain.value = 0.06;

        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.value = 400;

        this.osc1 = this.ctx.createOscillator();
        this.osc1.type = 'sawtooth';

        this.osc2 = this.ctx.createOscillator();
        this.osc2.type = 'triangle';

        this.setRpm(rpm);

        this.osc1.connect(this.filter);
        this.osc2.connect(this.filter);
        this.filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);

        this.osc1.start();
        this.osc2.start();
        this.isPlaying = true;
      }
      setRpm(rpm) {
        if (!this.isPlaying || !this.osc1 || !this.ctx) return;
        const baseFreq = Math.max(18, (rpm / 60) * 4);
        this.osc1.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
        this.osc2.frequency.setValueAtTime(baseFreq * 0.5, this.ctx.currentTime);
        if (this.filter) {
          this.filter.frequency.setValueAtTime(Math.min(2200, baseFreq * 4.5 + 180), this.ctx.currentTime);
        }
      }
      stop() {
        if (!this.isPlaying) return;
        try {
          this.osc1.stop();
          this.osc2.stop();
          this.osc1.disconnect();
          this.osc2.disconnect();
        } catch(e) {}
        this.isPlaying = false;
      }
    }

    function setupUniversalOrbitControls(camera, domElement, targetVec = new THREE.Vector3(0, 1.0, 0)) {
      if (typeof THREE.OrbitControls === 'function') {
        try {
          const ctrl = new THREE.OrbitControls(camera, domElement);
          ctrl.enableDamping = true;

      return { update: () => {}, dispose: () => {} };

    // =========================================================================
    // 3. MAIN REACT APP (CAD/CAM QUALITY & REAL-WORLD DIMENSIONS)
    // =========================================================================
    function SBC350App() {
      const [activeTab, setActiveTab] = useState('cockpit3d');
      // 'cockpit3d' | 'cadInspector' | 'dynoCell' | 'combustion' | 'egtDiagnostics' | 'leakdown' | 'modsim' | 'rotating' | 'trans' | 'aiCopilot' | 'shopBOM'

      const [bore, setBore] = useState(4.000);
      const [stroke, setStroke] = useState(3.480);
      const [rodLength, setRodLength] = useState(5.700);
      const [deckHeight, setDeckHeight] = useState(9.025);
      const [deckClearance, setDeckClearance] = useState(0.015);
      const [gasketThickness, setGasketThickness] = useState(0.039);
      const [chamberCc, setChamberCc] = useState(64.0);
      const [pistonReliefCc, setPistonReliefCc] = useState(5.0);

      // Valvetrain, Induction & Tuning
      const [camProfile, setCamProfile] = useState('street');
      const [rockerRatio, setRockerRatio] = useState(1.5);
      const [selectedIntake, setSelectedIntake] = useState('dualplane_rpm');
      const [carbCfm, setCarbCfm] = useState(650);
      const [ignitionTiming, setIgnitionTiming] = useState(36);
      const [targetAFR, setTargetAFR] = useState(12.9);

      // Drivetrain & Vehicle
      const [selectedTrans, setSelectedTrans] = useState('th350');
      const [stallSpeed, setStallSpeed] = useState(2400);
      const [rearGear, setRearGear] = useState(3.73);
      const [tireDiameter, setTireDiameter] = useState(26.0);

      // Dyno Weather Station (SAE J1349 Standard)
      const [baroInHg, setBaroInHg] = useState(29.92);
      const [dynoTempF, setDynoTempF] = useState(77.0);
      const [relHumidity, setRelHumidity] = useState(45.0);
      const [dynoSweepRate, setDynoSweepRate] = useState(600);
      const [dynoRunning, setDynoRunning] = useState(false);
      const [liveDynoRpm, setLiveDynoRpm] = useState(5600);

      // CAD & CAM Display Modes
      const [cadDimensionOverlay, setCadDimensionOverlay] = useState(true); // 3D In-Scene Calipers
      const [flirThermalMode, setFlirThermalMode] = useState(false);
      const [soundActive, setSoundActive] = useState(false);
      const [hoopsEdges, setHoopsEdges] = useState(true);
      const [cutawayMode, setCutawayMode] = useState('rightBank');
      const [explodedAmount, setExplodedAmount] = useState(0);
      const [isRunning, setIsRunning] = useState(false);
      const [selectedPartSpec, setSelectedPartSpec] = useState(null);

      // CAD Inspector Filter
      const [cadSearchTerm, setCadSearchTerm] = useState('');

      // AI Copilot Suite
      const [aiDrawerOpen, setAiDrawerOpen] = useState(false);
      const [aiQuery, setAiQuery] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [aiChatHistory, setAiChatHistory] = useState([
        {
          sender: 'ai',
          text: "Master Machinist & CAD/CAM Copilot active. Complete real-world mechanic dimension database loaded for Ray's SBC 350 (4.0000\" Bore, 3.4800\" Stroke, 5.7000\" Rods, 9.0250\" Deck, 64.0cc Chambers, .0390\" Gasket, .0150\" Deck Clearance, 9.90:1 SCR, Quench .0540\"). All parts drawn to precision CAD standards with live dimension leader callouts."
        }
      ]);

      const headerRef = useRef(null);
      const [headerHeight, setHeaderHeight] = useState(140);

      useEffect(() => {
        if (headerRef.current) setHeaderHeight(headerRef.current.offsetHeight || 140);
      }, []);

      const toggleAudio = () => {
        if (soundActive) {
          v8Audio.stop();
          setSoundActive(false);
        } else {
          v8Audio.start(liveDynoRpm);
          setSoundActive(true);
        }
      };

      useEffect(() => {
        if (soundActive) v8Audio.setRpm(liveDynoRpm);
      }, [liveDynoRpm, soundActive]);

      // =======================================================================
      // MODSIM MULTI-PHYSICS & SAE J1349 ENGINE
      // =======================================================================
      const testMath = useMemo(() => {
        const displacementCi = +((Math.PI / 4) * Math.pow(bore, 2) * stroke * 8).toFixed(2);
        const displacementL = +(displacementCi * 0.016387064).toFixed(3);
        const singleCylinderCc = +((displacementCi * 16.387064) / 8).toFixed(2);

        // Quench
        const quenchDistance = +(gasketThickness + deckClearance).toFixed(4);

        // Compression Ratios
        const deckVolumeCc = +(((Math.PI / 4) * Math.pow(bore, 2) * deckClearance * 16.387064)).toFixed(2);
        const gasketVolumeCc = +(((Math.PI / 4) * Math.pow(4.100, 2) * gasketThickness * 16.387064)).toFixed(2);
        const totalClearanceCc = +(chamberCc + gasketVolumeCc + deckVolumeCc + pistonReliefCc).toFixed(2);
        const staticCR = +((singleCylinderCc + totalClearanceCc) / totalClearanceCc).toFixed(2);

        // Kinematics
        const rodStrokeRatio = +(rodLength / stroke).toFixed(3);
        const maxRodAngleDeg = +(Math.asin((stroke / 2) / rodLength) * (180 / Math.PI)).toFixed(2);
        const meanPistonSpeed = Math.round((2 * stroke * liveDynoRpm) / 12);

        // Cam Data
        const camData = {
          rv: { name: "RV / High-Torque Hydraulic", intakeDur050: 212, exhDur050: 218, lobeLift: 0.300, baseHp: 310, baseTq: 395, hpRpm: 4800, tqRpm: 3200, ve: 0.84, recStall: 1800, ivcDeg: 38 },
          street: { name: "Street / Strip Hydraulic Roller (Ray's Spec)", intakeDur050: 224, exhDur050: 230, lobeLift: 0.340, baseHp: 385, baseTq: 415, hpRpm: 5600, tqRpm: 3800, ve: 0.90, recStall: 2400, ivcDeg: 44 },
          radical: { name: "Radical Solid Roller", intakeDur050: 242, exhDur050: 248, lobeLift: 0.370, baseHp: 445, baseTq: 425, hpRpm: 6400, tqRpm: 4600, ve: 0.98, recStall: 3500, ivcDeg: 52 }
        }[camProfile];

        const totalValveLift = +(camData.lobeLift * rockerRatio).toFixed(3);
        const effectiveStroke = stroke * (1 - (camData.ivcDeg / 180) * 0.45);
        const dynamicCR = +(((Math.PI / 4) * Math.pow(bore, 2) * effectiveStroke * 16.387064 + totalClearanceCc) / totalClearanceCc).toFixed(2);

        // SAE J1349 Atmospheric Correction Factor
        const satVaporInHg = 0.0085 * Math.exp(0.033 * dynoTempF);
        const vaporPressInHg = satVaporInHg * (relHumidity / 100);
        const dryBaroInHg = Math.max(20, baroInHg - vaporPressInHg);
        const tempK = (dynoTempF - 32) * (5 / 9) + 273.15;
        const dryPressHpa = dryBaroInHg * 33.8639;
        const saeCorrectionFactor = +(1.180 * ((990 / dryPressHpa) * Math.sqrt(tempK / 298)) - 0.180).toFixed(3);

        // Power Output Model
        const intakeMult = selectedIntake === 'tunnelram_dual' ? 1.12 : selectedIntake === 'singleplane_victor' ? 1.06 : 1.00;
        const timingFactor = ignitionTiming === 36 ? 1.0 : ignitionTiming > 38 ? 0.92 : 1.0 - (36 - ignitionTiming) * 0.015;
        const basePeakHp = Math.round(camData.baseHp * (staticCR / 9.90) * intakeMult * timingFactor);
        const basePeakTq = Math.round(camData.baseTq * (displacementCi / 350.4) * (intakeMult === 1.12 ? 0.94 : 1.0) * timingFactor);

        const correctedPeakHp = Math.round(basePeakHp * saeCorrectionFactor);
        const correctedPeakTq = Math.round(basePeakTq * saeCorrectionFactor);

        // Current Live Operating Point
        const tqFactor = 1.0 - Math.pow((liveDynoRpm - camData.tqRpm) / 3200, 2) * 0.38;
        const liveTorque = Math.max(120, Math.round(basePeakTq * tqFactor));
        const liveBhp = Math.round((liveTorque * liveDynoRpm) / 5252);
        const liveCorrectedBhp = Math.round(liveBhp * saeCorrectionFactor);
        const liveBmep = +((150.8 * liveTorque) / displacementCi).toFixed(1);
        const liveBsfc = +(0.46 + Math.pow((liveDynoRpm - 4200) / 4000, 2) * 0.08).toFixed(2);
        const fuelFlowLbHr = +(liveBhp * liveBsfc).toFixed(1);
        const fuelFlowGph = +(fuelFlowLbHr / 6.0).toFixed(1);

        // Combustion & EGT
        const peakCylPressurePsi = Math.round(180 + (liveBmep * 4.6));
        const lppDegAtdc = 15;
        const imepPsi = +(liveBmep * 1.12).toFixed(1);

        const baseEgt = Math.round(1240 + (liveDynoRpm / 6000) * 80);
        const egtChannels = [
          { cyl: 1, temp: baseEgt - 15, afr: (targetAFR + 0.1).toFixed(1) },
          { cyl: 2, temp: baseEgt - 10, afr: targetAFR.toFixed(1) },
          { cyl: 3, temp: baseEgt + 28, afr: (targetAFR - 0.2).toFixed(1), siamese: true },
          { cyl: 4, temp: baseEgt + 35, afr: (targetAFR - 0.2).toFixed(1), siamese: true },
          { cyl: 5, temp: baseEgt + 32, afr: (targetAFR - 0.2).toFixed(1), siamese: true },
          { cyl: 6, temp: baseEgt + 38, afr: (targetAFR - 0.2).toFixed(1), siamese: true },
          { cyl: 7, temp: baseEgt - 12, afr: targetAFR.toFixed(1) },
          { cyl: 8, temp: baseEgt - 18, afr: (targetAFR + 0.1).toFixed(1) }
        ];

        const crankingPsi = Math.round(14.7 * Math.pow(dynamicCR, 1.22));

        return {
          displacementCi,
          displacementL,
          quenchDistance,
          staticCR,
          dynamicCR,
          rodStrokeRatio,
          meanPistonSpeed,
          camData,
          totalValveLift,
          saeCorrectionFactor,
          correctedPeakHp,
          correctedPeakTq,
          liveBhp,
          liveCorrectedBhp,
          liveTorque,
          liveBmep,
          liveBsfc,
          fuelFlowLbHr,
          fuelFlowGph,
          peakCylPressurePsi,
          lppDegAtdc,
          imepPsi,
          egtChannels,
          crankingPsi
        };
      }, [bore, stroke, rodLength, deckHeight, deckClearance, gasketThickness, chamberCc, pistonReliefCc, camProfile, rockerRatio, selectedIntake, carbCfm, ignitionTiming, targetAFR, baroInHg, dynoTempF, relHumidity, liveDynoRpm]);

      // Automated Dyno Sweep Animation
      useEffect(() => {
        let timer;
        if (dynoRunning) {
          timer = setInterval(() => {
            setLiveDynoRpm(prev => {
              const step = Math.round(dynoSweepRate / 10);
              if (prev >= 6500) {
                setDynoRunning(false);

            if (parts.crank) parts.crank.rotation.z = currentCrankAngle;
            if (parts.cam) parts.cam.rotation.z = -currentCrankAngle / 2;

            // Slider-Crank Planar 2-Link Motion
            cylinderNodes.forEach((node) => {
              const alpha = currentCrankAngle + node.pinAngle - node.bankAngle;
              const sinBeta = (crankRadius / scaledRodLen) * Math.sin(alpha);
              const beta = Math.asin(sinBeta);
              const yPiston = (crankRadius * Math.cos(alpha)) + (scaledRodLen * Math.cos(beta));

              node.pistonGroup.position.y = yPiston;

              const pinX = crankRadius * Math.sin(alpha);
              const pinY = crankRadius * Math.cos(alpha);
              node.rodGroup.position.set(pinX, pinY, 0);
              node.rodGroup.rotation.z = -beta;
            });

            // Valvetrain Reciprocation & Spring Compression
            valvetrainNodes.forEach((v) => {
              const pulse = Math.max(0, Math.sin((currentCrankAngle / 2) + v.offset));
              const liftDist = pulse * 0.28;
              v.lifter.position.y = v.baseLifterY + liftDist;
              v.rocker.rotation.z = -pulse * 0.18;
              v.valve.position.y = v.baseValveY - liftDist;
              v.spring.scale.y = Math.max(0.65, 1.0 - (liftDist / 1.2));
            });
          }

          renderer.render(scene, camera);
        };
        animate(performance.now());

        return () => {
          cancelAnimationFrame(animId);
          if (renderer.domElement) renderer.domElement.removeEventListener('click', onCanvasClick);
          renderer.dispose();

                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                  <div className="bg-chevyPanel p-3.5 rounded-xl border border-cadCyan/40">
                    <span className="text-[10px] text-gray-400 block uppercase">PEAK PRESSURE (Pmax)</span>
                    <div className="text-xl font-black text-cadCyan mt-1">{testMath.peakCylPressurePsi} PSI</div>
                  </div>
                  <div className="bg-chevyPanel p-3.5 rounded-xl border border-emerald-500/40">
                    <span className="text-[10px] text-gray-400 block uppercase">LOCATION PEAK (LPP)</span>
                    <div className="text-xl font-black text-cadGreen mt-1">{testMath.lppDegAtdc}° ATDC</div>
                  </div>
                  <div className="bg-chevyPanel p-3.5 rounded-xl border border-chevyGold/40">
                    <span className="text-[10px] text-gray-400 block uppercase">INDICATED MEP</span>
                    <div className="text-xl font-black text-chevyGold mt-1">{testMath.imepPsi} PSI</div>
                  </div>
                  <div className="bg-chevyPanel p-3.5 rounded-xl border border-chevyOrange/40">
                    <span className="text-[10px] text-gray-400 block uppercase">DETONATION INDEX</span>
                    <div className="text-xl font-black text-emerald-400 mt-1">0.02 (CLEAN)</div>
                  </div>
                </div>

                <div className="bg-chevyPanel p-4 rounded-xl border border-gray-800 space-y-2">
                  <span className="text-white font-bold uppercase text-[11px]">COMBUSTION PRESSURE WAVE OVER 360°</span>
                  <div className="relative h-60 w-full crt-glow rounded-lg border border-emerald-950 p-2">
                    <svg className="w-full h-full" viewBox="0 0 800 220">
                      <line x1="400" y1="0" x2="400" y2="220" stroke="#334155" strokeDasharray="3" />
                      <text x="405" y="15" fill="#94a3b8" fontSize="10">TDC (0°)</text>
                      <path d="M 50 200 Q 280 180 340 120 T 430 25 T 480 110 T 750 200" fill="none" stroke="#00f0ff" strokeWidth="3" />
                      <circle cx="430" cy="25" r="4" fill="#00ff66" />
                      <text x="440" y="25" fill="#00ff66" fontSize="10">Pmax (15° ATDC)</text>
                    </svg>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: 8-CHANNEL EGT TELEMETRY */}
            {activeTab === 'egtDiagnostics' && (
              <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-5 font-mono text-xs">
                <div className="flex justify-between items-center pb-2 border-b border-gray-800">
                  <h2 className="text-base font-bold text-white uppercase tracking-wider font-sans">8-CHANNEL EGT & AIR/FUEL THERMAL GRADIENT</h2>
                  <button onClick={() => handleAskAi("Why do small block chevy center siamese exhaust ports run hotter EGT?")} className="px-3 py-1 rounded bg-purple-900/40 border border-purple-500/60 text-purple-300 font-bold hover:bg-purple-600 hover:text-white">
                    💡 Siamese Port Check
                  </button>
                </div>

                <div className="bg-chevyPanel p-4 rounded-xl border border-gray-800 space-y-3">
                  <div className="grid grid-cols-4 sm:grid-cols-8 gap-2 pt-2">
                    {testMath.egtChannels.map(ch => (
                      <div key={ch.cyl} className="bg-black/60 p-2.5 rounded-lg border border-gray-800 flex flex-col items-center">
                        <span className="text-[10px] text-gray-400 font-bold">CYL #{ch.cyl}</span>
                        <div className="h-32 w-6 bg-gray-900 rounded-full my-2 relative overflow-hidden flex flex-col justify-end">
                          <div 
                            style={{ height: `${((ch.temp - 1000) / 450) * 100}%` }}
                            className={`w-full rounded-full ${ch.siamese ? 'bg-gradient-to-t from-orange-500 to-red-500' : 'bg-gradient-to-t from-yellow-500 to-orange-500'}`}
                          />
                        </div>
                        <span className={`font-bold ${ch.siamese ? 'text-chevyOrange' : 'text-chevyGold'}`}>{ch.temp}°F</span>
                        <span className="text-[10px] text-gray-400 mt-1">AFR: {ch.afr}</span>
                        {ch.siamese && <span className="text-[9px] text-red-400 font-bold">SIAMESE</span>}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 6: LEAKDOWN BENCH */}
            {activeTab === 'leakdown' && (
              <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-5 font-mono text-xs">
                <h2 className="text-base font-bold text-white uppercase tracking-wider font-sans">100 PSI DIFFERENTIAL LEAKDOWN & CRANKING COMPRESSION</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-chevyPanel p-4 rounded-xl border border-emerald-500/40">
                    <span className="text-emerald-400 font-bold block">CRANKING COMPRESSION: {testMath.crankingPsi} PSI</span>
                    <p className="text-gray-400 text-[10px] mt-1">Dynamic ratio {testMath.dynamicCR}:1</p>
                  </div>
                  <div className="bg-chevyPanel p-4 rounded-xl border border-gray-800">
                    <span className="text-cadGreen font-bold block">LEAKDOWN: 4.2%</span>
                    <p className="text-gray-400 text-[10px] mt-1">95.8 / 100 PSI holding pressure</p>
                  </div>
                  <div className="bg-chevyPanel p-4 rounded-xl border border-gray-800">
                    <span className="text-cadCyan font-bold block">SEAL STATUS</span>
                    <p className="text-cadGreen font-bold text-[11px] mt-1">Rings & Valves Passed</p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 7: MODSIM SIMULATION */}
            {activeTab === 'modsim' && (
              <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-5 font-mono text-xs">
                <h2 className="text-base font-bold text-white uppercase tracking-wider font-sans">MODSIM MULTI-PHYSICS SIMULATION</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-chevyPanel p-3.5 rounded-xl border border-gray-800">
                    <span className="text-[10px] text-gray-400 uppercase">ROD/STROKE RATIO</span>
                    <div className="text-xl font-bold text-cadCyan">{testMath.rodStrokeRatio}:1</div>
                  </div>
                  <div className="bg-chevyPanel p-3.5 rounded-xl border border-gray-800">
                    <span className="text-[10px] text-gray-400 uppercase">QUENCH SQUISH</span>
                    <div className="text-xl font-bold text-emerald-400">{testMath.quenchDistance}"</div>
                  </div>
                  <div className="bg-chevyPanel p-3.5 rounded-xl border border-gray-800">
                    <span className="text-[10px] text-gray-400 uppercase">DYNAMIC COMPRESSION</span>
                    <div className="text-xl font-bold text-chevyGold">{testMath.dynamicCR}:1</div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 8: ROTATING ASSEMBLY */}
            {activeTab === 'rotating' && (
              <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-5 font-mono text-xs">
                <h2 className="text-base font-bold text-white uppercase tracking-wider font-sans">ROTATING ASSEMBLY & BLUEPRINT DIMENSIONS</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-chevyPanel p-4 rounded-xl border border-gray-800 space-y-2">
                    <div className="flex justify-between"><span className="text-gray-400">BORE:</span><span className="text-chevyOrange font-bold">{bore.toFixed(3)}"</span></div>
                    <input type="range" min="3.900" max="4.155" step="0.005" value={bore} onChange={e => setBore(parseFloat(e.target.value))} className="w-full accent-chevyOrange" />
                  </div>
                  <div className="bg-chevyPanel p-4 rounded-xl border border-gray-800 space-y-2">
                    <div className="flex justify-between"><span className="text-gray-400">STROKE:</span><span className="text-chevyGold font-bold">{stroke.toFixed(3)}"</span></div>
                    <input type="range" min="3.000" max="4.000" step="0.005" value={stroke} onChange={e => setStroke(parseFloat(e.target.value))} className="w-full accent-chevyGold" />
                  </div>
                  <div className="bg-chevyPanel p-4 rounded-xl border border-gray-800 space-y-2">
                    <div className="flex justify-between"><span className="text-gray-400">ROD LENGTH:</span><span className="text-emerald-400 font-bold">{rodLength.toFixed(3)}"</span></div>
                    <input type="range" min="5.565" max="6.125" step="0.005" value={rodLength} onChange={e => setRodLength(parseFloat(e.target.value))} className="w-full accent-emerald-400" />
                  </div>
                </div>
              </div>
            )}

            {/* TAB 9: TRANSMISSION MATRIX */}
            {activeTab === 'trans' && (
              <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-5 font-mono text-xs">
                <h2 className="text-base font-bold text-white uppercase tracking-wider font-sans">28-TRANSMISSION DRIVETRAIN RATIO AUDIT</h2>
                <div className="bg-chevyPanel p-4 rounded-xl border border-gray-800">
                  <select value={selectedTrans} onChange={e => setSelectedTrans(e.target.value)} className="bg-black/60 border border-gray-700 rounded p-2 text-white font-bold w-full max-w-md">
                    {Object.values(TRANSMISSIONS_DB).map(t => (
                      <option key={t.id} value={t.id}>[{t.type}] {t.name}</option>
                    ))}
                  </select>
                </div>
              </div>
            )}

            {/* TAB 10: AI RESEARCH COPILOT */}
            {activeTab === 'aiCopilot' && (
              <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-5 font-mono text-xs">
                <h2 className="text-base font-bold text-white uppercase tracking-wider font-sans flex items-center gap-2">
                  <span>🤖</span>
                  <span>NEURAL AI MACHINING COPILOT</span>
                </h2>
                <div className="bg-chevyPanel rounded-xl border border-purple-500/40 p-4 space-y-3">
                  <div className="h-64 overflow-y-auto space-y-2 p-2 bg-black/60 rounded-lg">
                    {aiChatHistory.map((m, i) => (
                      <div key={i} className={`p-2.5 rounded-lg text-xs leading-relaxed whitespace-pre-wrap ${m.sender === 'user' ? 'bg-purple-900/40 border border-purple-500/60 text-purple-200 ml-8' : 'bg-chevyCard border border-gray-700 text-gray-200 mr-8'}`}>
                        {m.text}
                      </div>
                    ))}
                  </div>
                  <form onSubmit={(e) => { e.preventDefault(); executeAiQuery(); }} className="flex gap-2">
                    <input type="text" placeholder="Ask about moving parts kinematics, CAD tolerances, or dyno sweeps..." value={aiQuery} onChange={(e) => setAiQuery(e.target.value)} className="flex-1 bg-black/60 border border-gray-700 rounded-lg px-3 py-2 text-white text-xs" />
                    <button type="submit" className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg text-xs">Search</button>
                  </form>
                </div>
              </div>
            )}

          </main>

          {/* FLOATING AI COPILOT DRAWER */}
          {aiDrawerOpen && (
            <div className="fixed inset-y-0 right-0 w-full sm:w-96 bg-chevyPanel/95 backdrop-blur-md border-l border-purple-500/50 shadow-2xl z-50 flex flex-col p-4 font-mono text-xs">
              <div className="flex items-center justify-between pb-3 border-b border-gray-800">
                <span className="font-bold text-white flex items-center gap-2"><span>🤖</span> AI MOTOR TEST COPILOT</span>
                <button onClick={() => setAiDrawerOpen(false)} className="text-gray-400 hover:text-white font-bold p-1">✕</button>
              </div>
              <div className="flex-1 overflow-y-auto space-y-2 py-3">
                {aiChatHistory.map((m, i) => (
                  <div key={i} className={`p-2.5 rounded-lg text-xs leading-relaxed whitespace-pre-wrap ${m.sender === 'user' ? 'bg-purple-900/40 border border-purple-500/60 text-purple-200 ml-4' : 'bg-black/60 border border-gray-800 text-gray-200 mr-4'}`}>
                    {m.text}
                  </div>
                ))}
              </div>
              <form onSubmit={(e) => { e.preventDefault(); executeAiQuery(); }} className="pt-2 border-t border-gray-800 flex gap-2">
                <input type="text" placeholder="Ask test diagnostic question..." value={aiQuery} onChange={(e) => setAiQuery(e.target.value)} className="flex-1 bg-black/60 border border-gray-700 rounded px-2.5 py-1.5 text-white text-xs" />
                <button type="submit" className="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded text-xs">Send</button>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SBC350App />);
  </script>
</body>
</html>
